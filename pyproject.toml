[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-exporter"
version = "0.1.0"
description = "Organize large photo/video archives into per-person folders using face embeddings, with resumable state across runs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
recognition = [
    "insightface>=0.7.3",
    "onnxruntime>=1.16",
    "opencv-python-headless>=4.8",
    "av>=11.0",
]
gpu = [
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.16",
    "opencv-python-headless>=4.8",
    "av>=11.0",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
frex = "frex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["frex"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
